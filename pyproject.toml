[project]
name = "rag_research"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex B",email = "ab@alexertech.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gensim (>=4.4.0,<5.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "numpy (>=2.4.0,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "datasets (>=4.4.2,<5.0.0)",
    "langsmith (>=0.2.0)",
    "python-dotenv (>=1.0.0)",
    "rank_bm25 (>=0.2.2)",
    "openai (>=1.0.0)"
]

[tool.poetry]
packages = [{include = "rag_research", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
